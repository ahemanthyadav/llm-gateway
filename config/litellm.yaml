# llm-gateway — capability routing (LiteLLM proxy config). The single place that maps the
# capability names clients use to concrete provider models. Clients NEVER name a vendor model.
#
# Capabilities (public contract — renaming one is a breaking change for every project):
#   fast-json     short structured outputs (summaries, extraction) — cheap + quick
#   general       everyday chat / writing
#   reasoning     harder multi-step questions
#   long-context  large inputs
#   embed         embeddings
#
# Ordered failover: each capability is a group whose fallback chain is "<cap>.2", "<cap>.3"
# (litellm_settings.fallbacks). Members of a chain come from DIFFERENT model families/providers.
# NVIDIA models: availability probed live 2026-10-18; order per the bake-off (ADR 0002) — replace ids here only.
#
# NVIDIA free tier ≈ 40 requests/min per ACCOUNT across all models: the per-deployment rpm values
# below must sum to ≤ 30 (headroom) — tests/test_config.py enforces it.
#
# Secrets: only `os.environ/NAME` references (env from Secret llm-gateway). Never a literal key.

model_list:
  # Chains rebuilt 2026-10-18 from a LIVE availability probe with the account's key: only models that answered
  # (several catalogue models return "Function not found for account" on this free account — docs/operations.md).
  # --- fast-json ------------------------------------------------------------------------------
  - model_name: fast-json
    # thinking off: with it on, short max_tokens returned EMPTY content (all spent on reasoning) — measured 2026-10-18
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 5, timeout: 60,
                     extra_body: {chat_template_kwargs: {enable_thinking: false}}}
    model_info: {gw_family: nemotron, gw_provider: nvidia, gw_cost: free}
  - model_name: fast-json.2
    litellm_params: {model: nvidia_nim/google/gemma-4-31b-it, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 4, timeout: 60}
    model_info: {gw_family: gemma, gw_provider: nvidia, gw_cost: free}
  - model_name: fast-json.3
    litellm_params: {model: nvidia_nim/openai/gpt-oss-20b, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 3, timeout: 60}
    model_info: {gw_family: gpt-oss, gw_provider: nvidia, gw_cost: free}

  # --- general --------------------------------------------------------------------------------
  - model_name: general
    litellm_params: {model: nvidia_nim/openai/gpt-oss-20b, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 4, timeout: 90}
    model_info: {gw_family: gpt-oss, gw_provider: nvidia, gw_cost: free}
  - model_name: general.2
    litellm_params: {model: nvidia_nim/google/gemma-4-31b-it, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 3, timeout: 90}
    model_info: {gw_family: gemma, gw_provider: nvidia, gw_cost: free}

  # --- reasoning ------------------------------------------------------------------------------
  - model_name: reasoning
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 3, timeout: 180}
    model_info: {gw_family: nemotron, gw_provider: nvidia, gw_cost: free}
  - model_name: reasoning.2
    litellm_params: {model: nvidia_nim/z-ai/glm-5.3, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 2, timeout: 180}
    model_info: {gw_family: glm, gw_provider: nvidia, gw_cost: free}

  # --- long-context ---------------------------------------------------------------------------
  - model_name: long-context
    litellm_params: {model: nvidia_nim/z-ai/glm-5.3, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 2, timeout: 240}
    model_info: {gw_family: glm, gw_provider: nvidia, gw_cost: free}
  - model_name: long-context.2
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 1, timeout: 240}
    model_info: {gw_family: nemotron, gw_provider: nvidia, gw_cost: free}

  # --- embed (2048-dim; NVIDIA asymmetric models: input_type query) ---------------------------
  - model_name: embed
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3-embed-1b, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 2, timeout: 60, input_type: query}
    model_info: {gw_family: nemotron-embed, gw_provider: nvidia, gw_cost: free, mode: embedding}
  - model_name: embed.2
    litellm_params: {model: nvidia_nim/nvidia/llama-nemotron-embed-vl-1b-v2, api_key: os.environ/NVIDIA_NIM_API_KEY, rpm: 1, timeout: 60, input_type: query}
    model_info: {gw_family: llama-nemotron-embed, gw_provider: nvidia, gw_cost: free, mode: embedding}

  # --- self-test (no provider, no key) — admin key only; proves routing in CI and in the cluster.
  # `selftest` deliberately points at a closed local port so every call FAILS and must fall back
  # to `selftest.2`, a canned mock response. ops/smoke.sh uses it.
  - model_name: selftest
    litellm_params: {model: openai/selftest-down, api_base: "http://127.0.0.1:9/v1", api_key: unused, timeout: 3}
    model_info: {gw_family: none, gw_provider: none, gw_cost: test}
  - model_name: selftest.2
    litellm_params: {model: openai/selftest-mock, mock_response: "SELFTEST-FALLBACK-OK", api_key: unused}
    model_info: {gw_family: mock, gw_provider: none, gw_cost: test}

  # --- non-NVIDIA providers (require provider keys via ops/set-provider-key.sh) ---
  # These models are available but NOT in active fallback chains yet.
  # Uncomment fallback references in litellm_settings.fallbacks after setting keys:
  #   ops/set-provider-key.sh groq-api-key <env-file> GROQ_API_KEY
  #   ops/set-provider-key.sh google-ai-key <env-file> GOOGLE_AI_API_KEY
  #
  # Groq — fast inference, generous free tier
  - model_name: groq-mixtral
    litellm_params: {model: groq/mixtral-8x7b-32768, api_key: os.environ/GROQ_API_KEY, rpm: 300, timeout: 30}
    model_info: {gw_family: mixtral, gw_provider: groq, gw_cost: paid}
  - model_name: groq-llama3-8b
    litellm_params: {model: groq/llama3-8b-8192, api_key: os.environ/GROQ_API_KEY, rpm: 500, timeout: 30}
    model_info: {gw_family: llama, gw_provider: groq, gw_cost: paid}

  # Google Gemini — generous context window, paid after free tier
  - model_name: gemini-flash
    litellm_params: {model: gemini/gemini-1.5-flash, api_key: os.environ/GOOGLE_AI_API_KEY, rpm: 1000, timeout: 60}
    model_info: {gw_family: gemini, gw_provider: google, gw_cost: paid}
  - model_name: gemini-pro
    litellm_params: {model: gemini/gemini-1.5-pro, api_key: os.environ/GOOGLE_AI_API_KEY, rpm: 2000, timeout: 120}
    model_info: {gw_family: gemini, gw_provider: google, gw_cost: paid}

litellm_settings:
  drop_params: true            # a provider that lacks an optional param must not fail the call
  request_timeout: 240
  num_retries: 2               # per group, on 429/5xx/timeout, before moving down the chain
  fallbacks:
    - fast-json: [fast-json.2, fast-json.3]
    - general: [general.2, fast-json]
    - reasoning: [reasoning.2, general]
    - long-context: [long-context.2]
    - embed: [embed.2]
    - selftest: [selftest.2]

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3             # failures per minute before a deployment is cooled down
  cooldown_time: 300           # seconds a failing deployment is skipped

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false     # routing lives in this file (git), not in the admin UI
  disable_spend_logs: false    # per-project usage is a feature (README "Projects")
