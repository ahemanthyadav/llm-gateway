name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml shellcheck-py==0.11.0.1
      - run: python3 tests/test_config.py
      - run: shellcheck -S error ops/*.sh examples/*.sh
      - name: manifests parse
        run: python3 -c "import yaml; list(yaml.safe_load_all(open('manifests/gateway.yaml')))"
